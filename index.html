<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space-Time Fabric - Level Selection</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #040410;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-image: radial-gradient(circle at 50% 50%, #1a1a3a 0%, #040410 100%);
        }

        #landing-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(10, 20, 40, 0.85);
            padding: 40px 60px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        h1 {
            margin: 0 0 30px;
            font-size: 2.2em;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            text-decoration: none;
            display: block;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        @media(max-width:768px) {
            #landing-hub {
                padding: 30px 24px;
                width: 90%;
            }

            h1 {
                font-size: 1.9em;
            }
        }
    </style>
</head>

<body>
    <div id="landing-hub">
        <h1>🪐 Space-Time Fabric<br>
            <span style="font-size:.5em;color:#aef;font-weight:normal;">Level Selection</span>
        </h1>
        <div class="nav">
            <a href="level1.html" class="btn">Level 1</a>
            <a href="level2.html" class="btn">Level 2</a>
        </div>
    </div>
</body>

</html>
