<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space-Time Gravity Lab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        html, body {
            width: 100%; height: 100%;
            overflow: hidden; overscroll-behavior: none;
            box-sizing: border-box; margin: 0; padding: 0;
            background: #040410; color: white;
            font-family: 'Segoe UI', sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; }
        canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
        button, select, input[type=range], input[type=color] { cursor: pointer; }

        #ui-header {
            position: absolute; top: 0; width: 100%;
            text-align: center; padding-top: 14px;
            pointer-events: none; z-index: 10;
        }
        .nav { pointer-events: auto; margin-top: 6px; }
        .btn {
            padding: 10px 22px; margin: 0 4px;
            border: none; border-radius: 28px;
            font-weight: bold; font-size: .9em; cursor: pointer;
            transition: transform .15s; min-height: 44px;
        }
        .btn:hover { transform: scale(1.07); }
        #btn-play { background: #88ff88; color: #000; display: none; }

        #toast {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(255,50,50,.92); color: white;
            padding: 10px 22px; border-radius: 10px; font-weight: bold;
            visibility: hidden; opacity: 0; transition: opacity .3s;
            z-index: 100; pointer-events: none;
        }

        /* ── Stage 3 sidebar panel ── */
        #s3-panel {
            position: absolute; left: 16px; top: 50%;
            transform: translateY(-50%);
            background: rgba(5,10,30,.85); border: 1px solid rgba(100,160,255,.35);
            border-radius: 16px; padding: 14px 12px;
            display: flex; flex-direction: column; gap: 10px;
            pointer-events: auto; z-index: 25; backdrop-filter: blur(8px);
            width: 256px; max-height: 90vh; overflow-y: auto;
        }
        .s3-title {
            font-size: .78em; text-transform: uppercase; letter-spacing: .08em;
            font-weight: 700; color: #88bbff; margin-bottom: 2px;
        }
        .s3-section { display: flex; flex-direction: column; gap: 8px; }
        .s3-row { display: flex; align-items: center; gap: 8px; font-size: .84em; }
        .s3-row label { min-width: 50px; flex-shrink: 0; color: #ccd; }
        .s3-row input[type=range] { flex: 1; min-width: 0; }
        .s3-row .val { min-width: 30px; text-align: right; font-size: .8em; color: #aabb; }

        .s3-btn {
            border: none; border-radius: 10px; padding: 10px 8px;
            font-size: .84em; font-weight: 700; cursor: pointer;
            color: #fff; min-height: 40px; text-align: center;
            transition: filter .15s;
        }
        .s3-btn:hover { filter: brightness(1.15); }
        .s3-btn.primary { background: linear-gradient(135deg, #1e7a40, #2ea855); }
        .s3-btn.action  { background: rgba(100,160,255,.25); border: 1px solid rgba(100,160,255,.4); }
        .s3-btn.danger  { background: rgba(255,80,80,.3); border: 1px solid rgba(255,80,80,.4); }
        .s3-btn.place   { background: linear-gradient(135deg, #1a3a7a, #2255cc); }

        .s3-divider { border: none; border-top: 1px solid rgba(255,255,255,.1); margin: 2px 0; }

        .note-text { font-size: .72em; color: #6688aa; line-height: 1.4; }

        /* ── Selected planet edit panel ── */
        #s3-edit-panel {
            position: absolute; bottom: 18px; left: 50%;
            transform: translateX(-50%);
            background: rgba(5,10,30,.9); border: 1px solid rgba(255,200,80,.35);
            border-radius: 14px; padding: 12px 16px;
            display: none; flex-direction: row; gap: 14px; align-items: center;
            pointer-events: auto; z-index: 30; backdrop-filter: blur(8px);
            flex-wrap: wrap; justify-content: center;
            max-width: min(620px, 96vw);
        }
        #s3-edit-panel label { color: #ddd; font-size: .82em; display: flex; flex-direction: column; gap: 3px; }
        #s3-edit-panel input[type=range] { width: 100px; }
        #s3-edit-panel .ep-title { color: #ffc966; font-weight: 700; font-size: .9em; white-space: nowrap; }
        #s3-edit-panel button { border: none; border-radius: 8px; padding: 8px 12px; font-weight: bold; cursor: pointer; min-height: 36px; font-size: .82em; }
        #ep-delete-btn { background: rgba(255,80,80,.35); color: #fff; border: 1px solid rgba(255,80,80,.5); }
        #ep-close-btn  { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.2); }

        /* ── Inline naming prompt ── */
        #s3-naming-prompt {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: rgba(4,8,28,.93); border: 1px solid rgba(100,200,255,.55);
            border-radius: 14px; padding: 14px 18px;
            display: none; flex-direction: column; align-items: center; gap: 8px;
            pointer-events: auto; z-index: 60; backdrop-filter: blur(10px);
            min-width: 240px; max-width: 92vw;
        }
        #s3-naming-prompt .np-title { color: #aaddff; font-size: .88em; font-weight: 700; text-align: center; }
        #s3-naming-prompt input[type=text] {
            background: rgba(255,255,255,.1); border: 1px solid rgba(100,200,255,.45);
            border-radius: 8px; color: #fff; padding: 8px 12px;
            font-size: .95em; width: 100%; min-height: 38px; outline: none;
        }
        #s3-naming-prompt input[type=text]:focus { border-color: rgba(100,200,255,.9); }
        #s3-naming-error { color: #ff8888; font-size: .76em; display: none; text-align: center; }
        #s3-naming-prompt .np-btn {
            border: none; border-radius: 9px; padding: 9px 18px; font-weight: 700;
            cursor: pointer; min-height: 38px; font-size: .86em;
            background: linear-gradient(135deg, #2255cc, #3399ff); color: #fff; width: 100%;
        }

        /* ── Escaped planets ── */
        #escaped-box {
            position: absolute; right: 16px; top: 110px;
            width: 220px; background: rgba(60,0,0,.75);
            border: 2px solid #ff5555; border-radius: 12px;
            padding: 10px; visibility: hidden;
            pointer-events: auto; z-index: 24;
        }
        .escaped-item {
            background: #1a0808; margin: 5px 0; padding: 8px;
            border-radius: 7px; font-size: 12px;
            display: flex; align-items: center; justify-content: space-between; gap: 6px;
        }
        .escaped-item button {
            background: rgba(100,180,255,.2); border: 1px solid rgba(100,180,255,.4);
            border-radius: 6px; color: #cce8ff; padding: 4px 8px;
            font-size: 11px; cursor: pointer; white-space: nowrap; min-height: 26px;
        }

        .planet-label {
            position: absolute; top: 0; left: 0;
            color: white; font: bold 11px 'Segoe UI', sans-serif;
            text-shadow: 0 0 5px #000; transform: translate(-50%,0);
            white-space: nowrap; pointer-events: none; z-index: 6; will-change: transform;
        }

        /* ── Zoom controls ── */
        .zoom-controls {
            position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 12px; z-index: 100;
        }
        .zoom-btn {
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(0,0,0,.65); color: white;
            border: 1px solid rgba(255,255,255,.2); font-size: 26px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(6px);
        }

        #fx-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        @media (max-width: 768px) {
            #s3-panel {
                width: 90%; left: 5%; bottom: 14px; top: auto;
                transform: none; max-height: 42vh;
            }
            #s3-edit-panel { bottom: 8px; gap: 10px; padding: 10px 12px; }
            #s3-edit-panel input[type=range] { width: 80px; }
            .zoom-controls { right: 10px; }
        }

        /* ── Collapsible panel (mobile) ── */
        .panel-toggle {
            display: flex; align-items: center; justify-content: space-between;
            gap: 6px; width: 100%; cursor: pointer; user-select: none;
        }
        .panel-collapse-btn {
            display: none;
            background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
            border-radius: 50%; color: #bbb;
            width: 26px; height: 26px; min-height: 26px;
            font-size: .6em; padding: 0; line-height: 1;
            cursor: pointer; flex-shrink: 0;
            align-items: center; justify-content: center;
            transition: transform .22s, background .15s;
        }
        .panel-collapse-btn:hover { background: rgba(255,255,255,.22); color: #fff; }
        .panel-body { display: flex; flex-direction: column; gap: 10px; }

        @media (max-width: 768px) {
            .panel-collapse-btn { display: flex; }
            .panel-collapsed .panel-body { display: none !important; }
            #s3-panel.panel-collapsed {
                gap: 0 !important; overflow: visible !important;
                padding: 8px 12px !important; max-height: unset !important;
            }
            .panel-collapsed .panel-collapse-btn { transform: rotate(-90deg); }
        }

        @media (min-width: 769px) {
            .panel-collapsed .panel-body { display: flex !important; }
        }
    </style>
</head>

<body>
    <div class="zoom-controls">
        <button class="zoom-btn" onclick="targetRadius = Math.max(600, targetRadius - 400); autoFollow=false;">+</button>
        <button class="zoom-btn" onclick="targetRadius = Math.min(9000, targetRadius + 400); autoFollow=false;">−</button>
    </div>

    <div id="landing-hub" style="display:none"></div>
    <canvas id="fx-canvas"></canvas>
    <div id="toast">Pause first!</div>

    <div id="ui-header" style="display:none">
        <div class="nav">
            <button class="btn" style="background:#223;color:#aef;padding:10px 14px;" onclick="window.location.href='index.html'">🏠 Home</button>
            <button class="btn" id="btn-play" onclick="togglePlay()">▶ Play</button>
        </div>
        <p id="hint" style="display:none;color:#aaeeff;font-size:.85em;margin-top:6px;pointer-events:none;">
            Only the central object pulls on planets in this model.</p>
    </div>

    <!-- ═══ STAGE 3 SIDEBAR ═══ -->
    <div id="s3-panel">
        <div class="panel-toggle" onclick="toggleMobilePanel('s3-panel')">
            <div class="s3-title" style="font-size:.95em;color:#fff;text-align:center;letter-spacing:.04em;">🌌 Gravity Lab</div>
            <button class="panel-collapse-btn" aria-label="Toggle panel">▼</button>
        </div>
        <div class="panel-body">

        <!-- Step 1: Central mass -->
        <div id="s3-step1" class="s3-section" style="display:flex">
            <div class="s3-title">Step 1 · Central Object</div>
            <div class="s3-row">
                <label>Mass</label>
                <input type="range" id="s3-sun-mass" min="60" max="600" step="10" value="320"
                    oninput="document.getElementById('s3-sm-val').textContent=this.value">
                <span class="val" id="s3-sm-val">320</span>
            </div>
            <div class="s3-row">
                <label>Color</label>
                <input type="color" id="s3-sun-color" value="#ffd700"
                    style="width:36px;height:28px;border:none;border-radius:5px;">
            </div>
            <button class="s3-btn primary" onclick="s3CreateSun()">✦ Create Central Object</button>
            <p class="note-text">Higher mass = deeper gravity well &amp; stronger pull on planets.</p>
        </div>

        <!-- Step 2: Add planets -->
        <div id="s3-step2" class="s3-section" style="display:none">
            <div class="s3-title">Step 2 · Add Planets</div>

            <div class="s3-row">
                <label>Mass</label>
                <input type="range" id="s3-p-mass" min="35" max="110" step="5" value="55"
                    oninput="document.getElementById('s3-pm-val').textContent=this.value">
                <span class="val" id="s3-pm-val">55</span>
            </div>
            <div class="s3-row">
                <label>Color</label>
                <input type="color" id="s3-p-color" value="#6ce0ff"
                    style="width:36px;height:28px;border:none;border-radius:5px;">
            </div>

            <hr class="s3-divider">
            <button class="s3-btn action" onclick="_showS3Step(1)">← Change Central Object</button>
            <button class="s3-btn danger" onclick="resetStage3()">↺ Reset Universe</button>

        </div>

        </div><!-- end panel-body -->
    </div>

    <!-- ═══ NAMING PROMPT ═══ -->
    <div id="s3-naming-prompt">
        <div class="np-title">Name your planet</div>
        <input type="text" id="s3-naming-input" placeholder="Enter a name…" autocomplete="off"
            onkeydown="if(event.key==='Enter')s3ConfirmName()">
        <div id="s3-naming-error"></div>
        <button class="np-btn" onclick="s3ConfirmName()">Confirm Name</button>
    </div>

    <!-- ═══ SELECTED PLANET EDIT ═══ -->
    <div id="s3-edit-panel">
        <span class="ep-title">Edit Planet</span>
        <label>
            Name
            <input type="text" id="s3-edit-name" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:6px;color:#fff;padding:4px 8px;font-size:.82em;width:90px;min-height:30px;" oninput="s3UpdateSelected();">
        </label>
        <label>
            Mass
            <input type="range" id="s3-edit-mass" min="35" max="110" step="5" value="55"
                oninput="document.getElementById('s3-em-val').textContent=this.value; s3UpdateSelected();">
        </label>
        <span class="val" id="s3-em-val" style="align-self:flex-end;margin-bottom:2px;">55</span>
        <label>
            Color
            <input type="color" id="s3-edit-color" value="#6ce0ff"
                style="width:36px;height:28px;border:none;border-radius:5px;margin-top:2px;"
                oninput="s3UpdateSelected();">
        </label>
        <span id="s3-edit-speed" style="font-size:.78em;color:#aabbcc;align-self:center;white-space:nowrap;"></span>
        <button id="ep-delete-btn" onclick="s3DeleteSelected()">🗑 Delete</button>
        <button id="ep-close-btn" onclick="s3HideEditPanel()">✕ Close</button>
    </div>

    <!-- ═══ LOST PLANETS ═══ -->
    <div id="escaped-box">
        <div style="font-weight:bold;color:#ff8888;margin-bottom:5px;">Lost Planets</div>
        <div id="lost-list"></div>
        <button onclick="restoreSystem()"
            style="background:#cc3333;border:none;border-radius:6px;padding:8px;color:white;width:100%;font-weight:bold;margin-top:6px;min-height:38px;">
            ↩ Reset Universe
        </button>
    </div>

    <div id="labels"></div>

    <script>
        function toggleMobilePanel(id) {
            if (window.innerWidth > 768) return;
            const el = document.getElementById(id);
            if (el) el.classList.toggle('panel-collapsed');
        }
        window.addEventListener('load', function() {
            if (window.innerWidth <= 768) {
                const panel = document.getElementById('s3-panel');
                if (panel) panel.classList.add('panel-collapsed');
            }
        });
    </script>
    <script src="core.js"></script>
    <script src="level2_common.js"></script>
    <script src="level2_assets.js"></script>
    <script src="level2_stage1.js"></script>
    <script src="level2_stage2.js"></script>
    <script src="level2_stage3.js"></script>
    <script src="level2_main.js"></script>
</body>

</html>
